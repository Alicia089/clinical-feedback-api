# .github/workflows/deploy.yml
#
# CI: Test suite on every push / PR
#
# Production deployment pipeline (ECR → App Runner) requires AWS secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
#   ECR_REPOSITORY, APP_RUNNER_SERVICE_ARN
#
# Engineering decision: AWS App Runner over ECS Fargate for initial deployment
#   WHY: App Runner abstracts away load balancer config, VPC setup, and task
#   definition management. For a single-service API at early scale, the ops
#   overhead savings outweigh the reduced control. ECS Fargate is the upgrade
#   path when multi-service orchestration or custom networking is needed.

name: CI/CD — Clinical Feedback API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .
